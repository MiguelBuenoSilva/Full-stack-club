<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu primeiro css</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h2>Crie Uma Conta</h2>
    </header>

    <form class="form-container" action="./sucess.html">
      <div class="form-row">
        <label for="fullName" class="form-label">Nome Completo</label>
        <input
          id="fullname"
          type="text"
          class="form-input"
          placeholder="Digite seu nome completo..."
          required
        />
      </div>

      <div class="form-row">
        <label for="email" class="form-label">E-mail</label>
        <input
          id="email"
          type="email"
          class="form-input"
          placeholder="Digite seu e-mail.."
          required
        />
      </div>

      <div class="form-row">
        <label for="password" class="form-label">Senha</label>
        <input
          id="password"
          type="password"
          class="form-input"
          placeholder="Digite sua senha..."
          required
        />
      </div>

      <div class="form-row">
        <label for="birthDate" class="form-label">Data de Nascimento</label>
        <input id="date" type="date" class="form-input" required />
      </div>

      <div class="form-row">
        <label for="gender" class="form-label">Gênero</label>
        <select id="gender" name="gender" class="form-input" required>
          <option value="masculino">Masculino</option>
          <option value="feminino">Feminino</option>
          <option value="outro">Outro</option>
        </select>
      </div>

      <div class="form-row">
        <input id="privacyTerms" type="checkbox" required />
        <label for="privacyTerms" class="form-small-label"
          >Aceito as políticas de privacidade.</label
        >
      </div>

      <div class="form-row">
        <input type="submit" value="Criar conta" class="form-button" />
      </div>
    </form>
  </body>
</html>
